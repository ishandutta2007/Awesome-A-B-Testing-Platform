<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Colors and Gradients for Elements -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Glowing Background Shapes -->
  <circle cx="200" cy="100" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="150" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="200" r="100" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- Tech Grid / Connecting Lines -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4">
    <line x1="150" y1="200" x2="350" y2="120" />
    <line x1="150" y1="200" x2="350" y2="280" />
    <line x1="350" y1="120" x2="550" y2="200" />
    <line x1="350" y1="280" x2="550" y2="200" />
    <line x1="550" y1="200" x2="750" y2="200" />
    <line x1="750" y1="200" x2="950" y2="120" />
    <line x1="750" y1="200" x2="950" y2="280" />
  </g>

  <!-- Node Points / A-B Split Visualisation -->
  <!-- Split Point -->
  <circle cx="150" cy="200" r="10" fill="#6366f1" filter="url(#glow-subtle)" />
  <circle cx="150" cy="200" r="5" fill="#ffffff" />
  
  <!-- Path A -->
  <circle cx="350" cy="120" r="16" fill="url(#aGrad)" filter="url(#glow-subtle)" />
  <text x="350" y="125" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">A</text>
  
  <!-- Path B -->
  <circle cx="350" cy="280" r="16" fill="url(#bGrad)" filter="url(#glow-subtle)" />
  <text x="350" y="285" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">B</text>

  <!-- Midpoint Hub -->
  <circle cx="550" cy="200" r="8" fill="#a855f7" filter="url(#glow-subtle)" />
  
  <!-- Optimization/Success Graph Node -->
  <g transform="translate(950, 200)">
    <!-- High Performing Path (Winner) -->
    <path d="M -200 -80 Q -100 -50 0 0 T 100 80" fill="none" stroke="#ec4899" stroke-width="4" filter="url(#glow-subtle)" />
    <circle cx="100" cy="80" r="12" fill="#ec4899" />
    <text x="100" y="85" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✓</text>
  </g>

  <!-- Banner Typography -->
  <g transform="translate(600, 190)">
    <!-- Subtitle / Topic -->
    <text x="0" y="-40" fill="#94a3b8" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="4" text-anchor="middle">CURATED EXPERIMENTATION RESOURCES</text>
    
    <!-- Main Title -->
    <text x="0" y="20" fill="url(#accentGrad)" font-family="'Outfit', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="1" text-anchor="middle">Awesome A/B Testing</text>
    <text x="0" y="65" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="400" letter-spacing="8" text-anchor="middle">PLATFORMS &amp; TOOLS</text>
  </g>

  <!-- Decorative Sparkles / Stars -->
  <path d="M 180,60 L 183,70 L 193,73 L 183,76 L 180,86 L 177,76 L 167,73 L 177,70 Z" fill="#e2e8f0" opacity="0.6" />
  <path d="M 1020,80 L 1022,85 L 1027,87 L 1022,89 L 1020,94 L 1018,89 L 1013,87 L 1018,85 Z" fill="#a855f7" opacity="0.8" />
</svg>
